<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} | {{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | strip_html | normalize_whitespace | escape }}">
<meta name="color-scheme" content="light">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b315a'/%3E%3Cpath d='M18 16v32m0-15 23-17M18 33l23 15' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/post.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
<p><a href="{{ '/' | relative_url }}">Karen Mosoyan</a> · <a href="{{ '/' | relative_url }}#writing">Writing</a></p>
</header>
<main id="main">
<article>
<h1>{{ page.title | escape }}</h1>
<p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
{{ content }}
</article>
</main>
<footer><a href="{{ '/' | relative_url }}#writing">Back to writing</a></footer>
</body>
</html>
